# general
gpu_id: 0
use_gpu: True
seed: [2024]
data_path: '../dataset/'
num_workers: 0
batch_size: 256          # b, Sec. 4.3
save_model: False
state: 'info'

# training settings, Sec. 4.3
epochs: 100
stopping_step: 5         # early stop patience
learner: adamW
learning_rate: 1e-4      # searched within [1e-4, 5e-5, 1e-3]
learning_rate_scheduler: [1.0, 50]
weight_decay: 5e-5
clip_grad_norm: 5.0
eval_step: 1

# evaluation settings, Eq. 16
metrics: ["Acc", "F1", "Precision", "Recall"]
valid_metric: Acc
report_combination: True  # per modality-combination results, Table 5

# iteration parameters
hyper_parameters: ["seed", "batch_size"]

# frame-level raw feature dim (VGG19 / VGGish / BERT, Sec. 3.1)
audio_dim: 1024
image_dim: 1024
text_dim: 1024
