# FakeSV+ with a global missing rate eta = 0.1 (Sec. 4.1, Table 2)
missing_rate: 0.1

# split scheme: 'event' -> Event-split (E.S., 5-fold, 80/20)
#               'time'  -> Temporal-split (T.S., 70/15/15)
dataset_mode: 'event'
fold: 5

# feature dirs, relative to ../dataset/<name>/
emb_path: '/embs/'
